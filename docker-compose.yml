version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT ONLY
# ─────────────────────────────────────────────────────────────────────────────
# Run with: docker compose up
# docker-compose.override.yml is applied automatically and exposes
# ports 5200 (API) and 6379 (Redis) on localhost.
#
# For Coolify deployment, see COOLIFY_DEPLOYMENT.md.
# Coolify uses the Dockerfile directly — NOT this file.
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: .
      dockerfile: src/Esportra.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__Redis=redis-local:6379,password=${REDIS_PASSWORD}
      - ConnectionStrings__Postgres=${ConnectionStrings__Postgres}
      - Supabase__JwtSecret=${Supabase__JwtSecret}
      - Supabase__JwtAudience=${Supabase__JwtAudience:-authenticated}
      - Supabase__JwtIssuer=${Supabase__JwtIssuer}
      - Supabase__Url=${Supabase__Url}
      - Supabase__ServiceKey=${Supabase__ServiceKey}
      - Resend__ApiKey=${Resend__ApiKey}
      - Riot__ApiKey=${Riot__ApiKey}
      - Riot__OAuthClientId=${Riot__OAuthClientId}
      - Riot__OAuthClientSecret=${Riot__OAuthClientSecret}
      - Faceit__ApiKey=${Faceit__ApiKey}
      - Faceit__ClientId=${Faceit__ClientId}
      - Faceit__ClientSecret=${Faceit__ClientSecret}
      - Rawg__ApiKey=${Rawg__ApiKey}
      - FrontendUrl=${FrontendUrl:-http://localhost:5173}
      - PartnerUrl=${PartnerUrl:-http://localhost:5174}
    depends_on:
      redis-local:
        condition: service_healthy
    restart: unless-stopped

  redis-local:
    image: redis:7-alpine
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  redis_data:
