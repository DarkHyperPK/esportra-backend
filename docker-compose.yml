version: "3.9"

# Coolify deployment compose.
# Switch the Coolify app type to "Docker Compose" and set:
#   Docker Compose File: docker-compose.yml
# Then add these environment variables in Coolify:
#   REDIS_PASSWORD, ConnectionStrings__Postgres, Supabase__JwtSecret, etc.
#
# For local development, docker-compose.override.yml is applied automatically.

services:
  api:
    build:
      context: .
      dockerfile: src/Esportra.Api/Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Staging}
      # Redis service is named 'esportra-redis-staging' below — same hostname
      # already configured in Coolify's ConnectionStrings__Redis env var.
      - ConnectionStrings__Redis=esportra-redis-staging:6379,password=${REDIS_PASSWORD}
      - ConnectionStrings__Postgres=${ConnectionStrings__Postgres}
      - Supabase__JwtSecret=${Supabase__JwtSecret}
      - Supabase__JwtAudience=${Supabase__JwtAudience:-authenticated}
      - Supabase__JwtIssuer=${Supabase__JwtIssuer}
      - Supabase__Url=${Supabase__Url}
      - Supabase__ServiceKey=${Supabase__ServiceKey}
      - Resend__ApiKey=${Resend__ApiKey}
      - Riot__ApiKey=${Riot__ApiKey}
      - Riot__OAuthClientId=${Riot__OAuthClientId}
      - Riot__OAuthClientSecret=${Riot__OAuthClientSecret}
      - Faceit__ApiKey=${Faceit__ApiKey}
      - Faceit__ClientId=${Faceit__ClientId}
      - Faceit__ClientSecret=${Faceit__ClientSecret}
      - Rawg__ApiKey=${Rawg__ApiKey}
      - FrontendUrl=${FrontendUrl:-https://esportra.com}
      - PartnerUrl=${PartnerUrl:-https://partner.esportra.com}
    depends_on:
      esportra-redis-staging:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  esportra-redis-staging:
    image: redis:7-alpine
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  redis_data:
