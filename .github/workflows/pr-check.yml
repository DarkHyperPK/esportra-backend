name: PR Check

on:
  pull_request:
    branches: [main, staging]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

  # ── Phase 5: forward-reference linter ──────────────────────────────────────
  # Scans all migration scripts in execution order and reports any DDL that
  # references a table created in a LATER script. Fails before the replay test
  # so the author gets a fast, actionable error message.
  migration-lint:
    name: Migration Lint (forward-reference check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check migrations for forward references
        run: python .github/scripts/lint-migrations.py

      - name: Check prod-absent table guards (main PRs)
        if: github.base_ref == 'main'
        run: python .github/scripts/lint-prod-table-references.py

  # ── Phase 4: full replay from an empty database ────────────────────────────
  # Spins up a fresh Postgres container and runs Esportra.Migrator against it.
  # Every migration must apply cleanly from scratch. Fails the PR if any script
  # errors out, so migration bugs never reach main/staging.
  migration-replay:
    name: Migration Replay (full replay from empty DB)
    runs-on: ubuntu-latest
    needs: [build, migration-lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migrationtest
          POSTGRES_DB: esportra_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Apply Supabase replay bootstrap
        run: bash .github/scripts/apply-replay-bootstrap.sh

      - name: Run full migration replay
        env:
          ConnectionStrings__Postgres: >-
            Host=localhost;Port=5432;Database=esportra_test;
            Username=postgres;Password=migrationtest;
            Trust Server Certificate=true;
        run: >
          dotnet run
          --project src/Esportra.Migrator/Esportra.Migrator.csproj
          -c Release

