name: PR Check

on:
  pull_request:
    branches: [main, staging]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

  migration-lint:
    name: Migration Lint (forward-reference check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check migrations for forward references
        run: python .github/scripts/lint-migrations.py

      - name: Verify replay fixture artifacts are up to date
        id: verify-artifacts
        run: |
          python .github/scripts/audit-replay-legacy-deps.py --check
          python .github/scripts/generate-replay-journal-seed.py --check
          python .github/scripts/generate-post-baseline-replay-schema.py --check

      - name: Regenerate artifacts on failure (for download)
        if: failure() && steps.verify-artifacts.outcome == 'failure'
        run: |
          python .github/scripts/audit-replay-legacy-deps.py
          python .github/scripts/generate-replay-journal-seed.py
          python .github/scripts/generate-post-baseline-replay-schema.py

      - name: Upload regenerated artifacts
        if: failure() && steps.verify-artifacts.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-ci-artifacts
          path: .github/ci/

      - name: Check prod-absent table guards (main PRs)
        if: github.base_ref == 'main'
        run: python .github/scripts/lint-prod-table-references.py

  migration-replay:
    name: Migration Replay (post-baseline from baseline schema)
    runs-on: ubuntu-latest
    needs: [build, migration-lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migrationtest
          POSTGRES_DB: esportra_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Apply post-baseline replay fixture
        run: bash .github/scripts/apply-replay-bootstrap.sh

      - name: Run post-baseline migration replay
        env:
          ConnectionStrings__Postgres: >-
            Host=localhost;Port=5432;Database=esportra_test;
            Username=postgres;Password=migrationtest;
            Trust Server Certificate=true;
        run: >
          dotnet run
          --project src/Esportra.Migrator/Esportra.Migrator.csproj
          -c Release

      - name: Assert migration replay completed
        run: bash .github/scripts/assert-migration-replay-complete.sh

      - name: Assert BR games model schema
        run: bash .github/scripts/assert-br-games-schema.sh
