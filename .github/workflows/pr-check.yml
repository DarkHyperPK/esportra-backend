name: PR Check

on:
  pull_request:
    branches: [main, staging]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

  migration-replay:
    name: Migration Replay
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migrationtest
          POSTGRES_DB: esportra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Apply replay fixture
        run: bash .github/scripts/apply-replay-bootstrap.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: migrationtest
          PGDATABASE: esportra_test

      - name: Run migrations
        run: dotnet run --project src/Esportra.Migrator -c Release
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=esportra_test;Username=postgres;Password=migrationtest"

      - name: Assert migrations complete
        run: bash .github/scripts/assert-migration-replay-complete.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: migrationtest
          PGDATABASE: esportra_test

  # Simulates staging → prod merge: applies main's migrations first, then PR's new ones
  migration-prod-compat:
    name: Migration Prod Compatibility
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migrationtest
          POSTGRES_DB: esportra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Step 1: Apply baseline
      - name: Apply replay fixture (baseline)
        run: bash .github/scripts/apply-replay-bootstrap.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: migrationtest
          PGDATABASE: esportra_test

      # Step 2: Apply only main branch migrations (simulates prod state)
      - name: Checkout main branch migrations
        run: |
          git checkout origin/main -- src/Esportra.Infrastructure/Migrations/Scripts/
          echo "Applying migrations from main branch (prod state)..."

      - name: Run main branch migrations (prod state)
        run: dotnet run --project src/Esportra.Migrator -c Release
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=esportra_test;Username=postgres;Password=migrationtest"

      # Step 3: Restore PR migrations and apply delta
      - name: Restore PR branch migrations
        run: |
          git checkout ${{ github.sha }} -- src/Esportra.Infrastructure/Migrations/Scripts/
          echo "Applying new migrations from PR (staging → prod merge)..."

      - name: Run PR migrations (simulates merge to prod)
        run: dotnet run --project src/Esportra.Migrator -c Release
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=esportra_test;Username=postgres;Password=migrationtest"

      - name: Assert migrations complete
        run: bash .github/scripts/assert-migration-replay-complete.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: migrationtest
          PGDATABASE: esportra_test

