name: Build & Deploy — Staging

on:
  push:
    branches: [staging]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

  # ── Phase 5: forward-reference linter ──────────────────────────────────────
  migration-lint:
    name: Migration Lint (forward-reference check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check migrations for forward references
        run: python .github/scripts/lint-migrations.py

  # ── Phase 6: pre-deploy migration step ─────────────────────────────────────
  # Run the dedicated migrator against the real staging database before the API
  # rollout is triggered. This separates migration failure from app boot.
  migrate:
    name: Migrate staging schema
    runs-on: ubuntu-latest
    needs: [build, migration-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Validate staging migration secret
        env:
          CONNECTION: ${{ secrets.STAGING_POSTGRES_MIGRATIONS_CONNECTION }}
        run: |
          if [ -z "$CONNECTION" ]; then
            echo "Missing required secret: STAGING_POSTGRES_MIGRATIONS_CONNECTION" >&2
            exit 1
          fi

      - name: Apply pending migrations
        env:
          ConnectionStrings__PostgresMigrations: ${{ secrets.STAGING_POSTGRES_MIGRATIONS_CONNECTION }}
        run: >
          dotnet run
          --project src/Esportra.Migrator/Esportra.Migrator.csproj
          -c Release

      - name: Verify staging schema compatibility
        env:
          ConnectionStrings__PostgresMigrations: ${{ secrets.STAGING_POSTGRES_MIGRATIONS_CONNECTION }}
        run: >
          dotnet run
          --project src/Esportra.Migrator/Esportra.Migrator.csproj
          -c Release
          --no-build
          --
          --check-compatibility

  deploy:
    name: Deploy to Coolify (Staging)
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify staging deployment
        # If COOLIFY_STAGING_WEBHOOK is not yet configured, Coolify's native
        # auto-deploy handles the deployment — this step exits cleanly.
        # To enable CI-gated deploys:
        #   1. Coolify → staging app → Deployments tab → copy Webhook URL
        #   2. GitHub → Settings → Secrets → Actions → add COOLIFY_STAGING_WEBHOOK
        #   3. Coolify → staging app → disable "Auto Deploy on push"
        #   4. GitHub → Settings → Secrets → Actions → add STAGING_POSTGRES_MIGRATIONS_CONNECTION
        env:
          WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "ℹ️ COOLIFY_STAGING_WEBHOOK not configured — Coolify auto-deploy handles deployment."
            exit 0
          fi
          curl --fail --silent --show-error -X GET "$WEBHOOK"

