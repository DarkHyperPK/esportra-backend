name: Build & Deploy — Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging-backend
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'src/**'
              - '*.sln'
              - 'Directory.*.props'
            migrations:
              - 'src/Esportra.Infrastructure/Migrations/Scripts/**'

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

  lint:
    name: Format & Lint
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  test:
    name: Test
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore -c Release

  migration-replay:
    name: Migration Lint & Replay
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migrationtest
          POSTGRES_DB: esportra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Lint migration scripts
        run: |
          python .github/scripts/lint-migrations.py
          python .github/scripts/lint-prod-table-references.py

      - name: Apply replay fixture
        run: bash .github/scripts/apply-replay-bootstrap.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: migrationtest
          PGDATABASE: esportra_test

      - name: Run migrations
        run: dotnet run --project src/Esportra.Migrator -c Release
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=esportra_test;Username=postgres;Password=migrationtest"

      - name: Assert migrations complete
        run: bash .github/scripts/assert-migration-replay-complete.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: migrationtest
          PGDATABASE: esportra_test

      - name: Re-run migrations and assert idempotency
        run: |
          dotnet run --project src/Esportra.Migrator -c Release
          bash .github/scripts/assert-migration-replay-complete.sh
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=esportra_test;Username=postgres;Password=migrationtest"
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: migrationtest
          PGDATABASE: esportra_test

  promote:
    name: Promote to deploy/staging
    needs: [build, lint, test, migration-replay]
    if: |
      always() && !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.migration-replay.result == 'success' || needs.migration-replay.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward deploy/staging
        uses: ./.github/actions/promote-deploy-branch
        with:
          deploy_branch: deploy/staging

  smoke:
    name: Post-deploy smoke (staging API)
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Coolify deploy
        run: sleep 120

      - name: API smoke tests
        env:
          API_URL: ${{ secrets.E2E_STAGING_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning title=Smoke skipped::E2E_STAGING_API_URL not set — post-deploy smoke skipped."
            exit 0
          fi
          bash .github/scripts/smoke-test.sh "$API_URL"

  notify-failure:
    name: Report failure
    needs: [build, lint, test, migration-replay, promote, smoke]
    if: failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify-failure
        with:
          webhook_url: ${{ secrets.CI_NOTIFY_WEBHOOK_URL }}
