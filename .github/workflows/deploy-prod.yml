name: Build & Deploy — Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod-backend
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore -c Release

  migration-replay:
    name: Migration Lint & Replay
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migrationtest
          POSTGRES_DB: esportra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Lint migration scripts
        run: |
          python .github/scripts/lint-migrations.py
          python .github/scripts/lint-prod-table-references.py

      # Regenerate fixtures after any migration that drops/renames a constraint or index:
      #   PROD_SSH_KEY=~/.ssh/esportra-prod.key bash .github/scripts/dump-replay-schema.sh --env production
      - name: Apply replay fixture
        run: bash .github/scripts/apply-replay-bootstrap.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: migrationtest
          PGDATABASE: esportra_test
          REPLAY_SCHEMA_FILE: .github/ci/post-baseline-prod-replay-schema.sql
          REPLAY_JOURNAL_FILE: .github/ci/replay-prod-journal-seed.sql

      - name: Run migrations
        run: dotnet run --project src/Esportra.Migrator -c Release
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=esportra_test;Username=postgres;Password=migrationtest"

      - name: Assert migrations complete
        run: bash .github/scripts/assert-migration-replay-complete.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: migrationtest
          PGDATABASE: esportra_test

      - name: Re-run migrations and assert idempotency
        run: |
          dotnet run --project src/Esportra.Migrator -c Release
          bash .github/scripts/assert-migration-replay-complete.sh
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=esportra_test;Username=postgres;Password=migrationtest"
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: migrationtest
          PGDATABASE: esportra_test

  gate:
    name: All checks passed
    needs: [build, lint, test, migration-replay]
    runs-on: ubuntu-latest
    steps:
      - name: Gate passed
        run: echo "All pre-deploy checks passed — build, lint, tests, migrations."

  promote:
    name: Promote to deploy/main
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward deploy/main
        uses: ./.github/actions/promote-deploy-branch
        with:
          deploy_branch: deploy/main

  smoke:
    name: Post-deploy smoke (production API)
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Coolify deploy
        run: sleep 120

      - name: API smoke tests
        env:
          API_URL: ${{ secrets.E2E_PROD_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning title=Smoke skipped::E2E_PROD_API_URL not set — post-deploy smoke skipped."
            exit 0
          fi
          bash .github/scripts/smoke-test.sh "$API_URL"

  notify-failure:
    name: Report failure
    needs: [build, lint, test, migration-replay, gate, promote, smoke]
    if: failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify-failure
        with:
          webhook_url: ${{ secrets.CI_NOTIFY_WEBHOOK_URL }}
