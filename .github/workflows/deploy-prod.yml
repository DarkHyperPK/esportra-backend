name: Build & Deploy — Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod-backend
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore -c Release

  migration-lint:
    name: Migration Lint (forward-reference check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check migrations for forward references
        run: python .github/scripts/lint-migrations.py

      - name: Verify replay fixture artifacts are up to date
        run: |
          python .github/scripts/audit-replay-legacy-deps.py --check
          python .github/scripts/generate-replay-journal-seed.py --check
          python .github/scripts/generate-post-baseline-replay-schema.py --check

      - name: Check prod-absent table guards
        run: python .github/scripts/lint-prod-table-references.py

  migration-replay:
    name: Migration Replay (post-baseline from baseline schema)
    runs-on: ubuntu-latest
    needs: [build, migration-lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migrationtest
          POSTGRES_DB: esportra_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Apply post-baseline replay fixture
        run: bash .github/scripts/apply-replay-bootstrap.sh

      - name: Run post-baseline migration replay
        env:
          ConnectionStrings__Postgres: >-
            Host=localhost;Port=5432;Database=esportra_test;
            Username=postgres;Password=migrationtest;
            Trust Server Certificate=true;
        run: >
          dotnet run
          --project src/Esportra.Migrator/Esportra.Migrator.csproj
          -c Release

      - name: Assert migration replay completed
        run: bash .github/scripts/assert-migration-replay-complete.sh

  gate:
    name: All checks passed
    needs: [build, lint, test, migration-lint, migration-replay]
    runs-on: ubuntu-latest
    steps:
      - name: Gate passed
        run: echo "All pre-deploy checks passed — build, lint, tests, migrations."

  promote:
    name: Promote to deploy/main
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward deploy/main
        uses: ./.github/actions/promote-deploy-branch
        with:
          deploy_branch: deploy/main

  smoke:
    name: Post-deploy smoke (production API)
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Coolify deploy
        run: sleep 120

      - name: API smoke tests
        env:
          API_URL: ${{ secrets.E2E_PROD_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning title=Smoke skipped::E2E_PROD_API_URL not set — post-deploy smoke skipped."
            exit 0
          fi
          bash .github/scripts/smoke-test.sh "$API_URL"

  notify-failure:
    name: Report failure
    needs: [build, lint, test, migration-lint, migration-replay, gate, promote, smoke]
    if: failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify-failure
        with:
          webhook_url: ${{ secrets.CI_NOTIFY_WEBHOOK_URL }}
