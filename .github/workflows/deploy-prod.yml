name: Build & Deploy — Production

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

  # ── Phase 5: forward-reference linter ──────────────────────────────────────
  migration-lint:
    name: Migration Lint (forward-reference check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check migrations for forward references
        run: python .github/scripts/lint-migrations.py

  # ── Phase 6: pre-deploy migration step ─────────────────────────────────────
  # Run the dedicated migrator against the real production database before the
  # API rollout is triggered. This separates migration failure from app boot.
  migrate:
    name: Migrate production schema
    runs-on: ubuntu-latest
    needs: [build, migration-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Validate production migration secret
        env:
          CONNECTION: ${{ secrets.PROD_POSTGRES_MIGRATIONS_CONNECTION }}
        run: |
          if [ -z "$CONNECTION" ]; then
            echo "Missing required secret: PROD_POSTGRES_MIGRATIONS_CONNECTION" >&2
            exit 1
          fi

      - name: Apply pending migrations
        env:
          ConnectionStrings__PostgresMigrations: ${{ secrets.PROD_POSTGRES_MIGRATIONS_CONNECTION }}
        run: >
          dotnet run
          --project src/Esportra.Migrator/Esportra.Migrator.csproj
          -c Release

      - name: Verify production schema compatibility
        env:
          ConnectionStrings__PostgresMigrations: ${{ secrets.PROD_POSTGRES_MIGRATIONS_CONNECTION }}
        run: >
          dotnet run
          --project src/Esportra.Migrator/Esportra.Migrator.csproj
          -c Release
          --no-build
          --
          --check-compatibility

  deploy:
    name: Deploy to Coolify (Production)
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify production deployment
        # Production Coolify app is not yet created.
        # When ready:
        #   1. Coolify → prod app → Deployments tab → copy Webhook URL
        #   2. GitHub → Settings → Secrets → Actions → add COOLIFY_PROD_WEBHOOK
        #   3. Coolify → prod app → disable "Auto Deploy on push"
        #   4. GitHub → Settings → Secrets → Actions → add PROD_POSTGRES_MIGRATIONS_CONNECTION
        env:
          WEBHOOK: ${{ secrets.COOLIFY_PROD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "ℹ️ COOLIFY_PROD_WEBHOOK not configured — skipping production deployment."
            exit 0
          fi
          curl --fail --silent --show-error -X GET "$WEBHOOK"

