name: Build & Deploy — Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod-backend
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "9.0.x" }
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "9.0.x" }
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --verbosity diagnostic

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "9.0.x" }
      - run: dotnet restore
      - run: dotnet test --no-restore -c Release

  migration-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: python .github/scripts/lint-migrations.py
      - run: python .github/scripts/lint-prod-table-references.py
      - run: python .github/scripts/audit-replay-legacy-deps.py --check
      - run: python .github/scripts/generate-post-baseline-replay-schema.py --check
      - run: python .github/scripts/generate-replay-journal-seed.py --check

  migration-replay:
    needs: [build, migration-lint]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migrationtest
          POSTGRES_DB: esportra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "9.0.x" }
      - name: Apply replay fixture
        run: bash .github/scripts/apply-replay-bootstrap.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: migrationtest
          PGDATABASE: esportra_test
      - name: Run migrations
        run: dotnet run --project src/Esportra.Migrator -c Release
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=esportra_test;Username=postgres;Password=migrationtest"
      - name: Assert migrations complete
        run: bash .github/scripts/assert-migration-replay-complete.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: migrationtest
          PGDATABASE: esportra_test

  promote:
    needs: [build, format, test, migration-lint, migration-replay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/promote-deploy-branch
        with: { deploy_branch: deploy/main }

  smoke:
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sleep 120
      - name: API smoke tests
        env:
          API_URL: ${{ secrets.E2E_PROD_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then exit 0; fi
          bash .github/scripts/smoke-test.sh "$API_URL"

  notify-failure:
    needs: [build, format, test, migration-lint, migration-replay, promote, smoke]
    if: failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify-failure
        with: { webhook_url: ${{ secrets.CI_NOTIFY_WEBHOOK_URL }} }
