name: Notify CI failure
description: Open or update a GitHub issue and optionally POST to a webhook when a workflow fails.

inputs:
  webhook_url:
    description: Optional Slack/Discord/generic webhook URL (CI_NOTIFY_WEBHOOK_URL secret)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Create or update GitHub issue
      uses: actions/github-script@v7
      with:
        script: |
          const workflow = context.payload.workflow?.name ?? process.env.GITHUB_WORKFLOW;
          const branch = context.ref.replace('refs/heads/', '');
          const sha = context.sha.slice(0, 7);
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const title = `[CI] ${workflow} failed on ${branch} (${sha})`;
          const body = [
            `**Workflow:** ${workflow}`,
            `**Branch:** \`${branch}\``,
            `**Commit:** [\`${context.sha.slice(0, 7)}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})`,
            `**Run:** ${runUrl}`,
            '',
            'Check the failed job logs in GitHub Actions.',
            '',
            '_Auto-created by CI notify action. Close when resolved; a new failure will comment on this issue._',
          ].join('\n');

          const label = 'ci-failure';
          try {
            await github.rest.issues.createLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label,
              color: 'b60205',
              description: 'Automated CI/CD failure reports',
            });
          } catch (error) {
            if (error?.status !== 422) throw error;
          }

          let issues = [];
          try {
            ({ data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 20,
            }));
          } catch (error) {
            core.warning(`Could not list issues by label: ${error.message}`);
          }

          const existing = issues.find((issue) => issue.title.startsWith(`[CI] ${workflow} failed on ${branch}`));
          if (existing) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Another failure on ${branch} @ \`${sha}\`: ${runUrl}`,
            });
            core.info(`Updated issue #${existing.number}`);
            return;
          }

          const { data: created } = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title,
            body,
            labels: [label],
          });
          core.info(`Created issue #${created.number}`);

    - name: Post webhook notification
      if: inputs.webhook_url != ''
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook_url }}
      run: |
        set -euo pipefail
        payload="$(python3 - <<'PY'
        import json, os
        print(json.dumps({
          "text": f"CI failed: {os.environ['GITHUB_WORKFLOW']} on {os.environ['GITHUB_REF_NAME']} — {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
        }))
        PY
        )"
        curl --fail --silent --show-error -X POST "$WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d "$payload"
